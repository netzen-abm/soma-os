version: 2
updates:
  # Rust dependencies for the backend. Dependabot reads Cargo.toml here.
  - package-ecosystem: "cargo"
    directory: "/services/backend-rust"
    schedule:
      interval: "weekly"

  # GitHub Actions workflow and action version updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
