version: 2
updates:
  # Keep automated dependency work bounded: one grouped PR per ecosystem.
  - package-ecosystem: "cargo"
    directory: "/services/backend-rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
