name: One-shot Authorization Cleanup

on:
  push:
    branches:
      - feat/canonical-principal-subject-scope-v4-clean

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-principal-subject-scope-v4-clean
          fetch-depth: 0
      - name: Apply minimal source-preserving authorization migration
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('services/backend-rust/src')
          p = root / 'canonical_authorization.rs'
          s = p.read_text()
          if 'pub subject_ref: String,' not in s:
              s = s.replace('    pub principal_ref: String,\n    pub capability_id:', '    pub principal_ref: String,\n    pub subject_ref: String,\n    pub capability_id:', 1)
          s = re.sub(r'(\n(?P<indent>\s*)principal_ref:\s*(?P<expr>[^\n]+),\n)(?P=indent)capability_id:', lambda m: m.group(1) + m.group('indent') + 'subject_ref: ' + m.group('expr') + ',\n' + m.group('indent') + 'capability_id:', s)
          p.write_text(s)

          for p in root.glob('*.rs'):
              if p.name == 'canonical_authorization.rs':
                  continue
              s = p.read_text()
              if 'AuthorizationRequest' not in s:
                  continue
              s = re.sub(r'(\n(?P<indent>\s*)principal_ref:\s*(?P<expr>[^\n]+),\n)(?P=indent)capability_id:', lambda m: m.group(1) + m.group('indent') + 'subject_ref: ' + m.group('expr') + ',\n' + m.group('indent') + 'capability_id:', s)
              p.write_text(s)

          for name in ('health_state_evidence_link.rs','health_state_intervention.rs','health_state_measurement.rs','health_state_outcome.rs','health_state_repository.rs','longitudinal_context.rs','longitudinal_observation_repository.rs'):
              p = root / name
              s = p.read_text()
              if 'principal_ref: String,' not in s:
                  s = re.sub(r'(pub struct Authorized\w+ \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: String,\n\2\3', s, count=1)
              s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
              s = s.replace('subject_ref: request.principal_ref.clone()', 'subject_ref: request.subject_ref.clone()')
              if 'pub fn principal_ref(&self)' not in s and 'pub fn subject_ref(&self)' in s:
                  s = s.replace('    pub fn subject_ref(&self)', '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self)', 1)
              p.write_text(s)

          p = root / 'protected_db_context.rs'
          s = p.read_text()
          if 'principal_ref: String,' not in s:
              s = re.sub(r'(pub struct AuthorizedProtectedDbContext \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: String,\n\2\3', s, count=1)
          s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
          s = s.replace('subject_ref: request.principal_ref.clone()', 'subject_ref: request.subject_ref.clone()')
          if 'pub fn principal_ref(&self)' not in s and 'pub fn subject_ref(&self)' in s:
              s = s.replace('    pub fn subject_ref(&self)', '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self)', 1)
          p.write_text(s)

          p = root / 'local_health_vault_storage.rs'
          s = p.read_text()
          if 'pub principal_ref: String,' not in s:
              s = s.replace('pub struct AuthorizationContext {\n    pub subject_ref:', 'pub struct AuthorizationContext {\n    pub principal_ref: String,\n    pub subject_ref:', 1)
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          for name in ('health_state_repository.rs','local_longitudinal_observation_repository.rs'):
              p = root / name
              s = p.read_text().replace('AuthorizationContext {\n            subject_ref:', 'AuthorizationContext {\n            principal_ref: context.principal_ref().to_owned(),\n            subject_ref:', 1)
              p.write_text(s)

          p = root / 'personal_health_record_repository.rs'
          s = p.read_text()
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref: "person-1"\.into\(\),)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          p = root / 'canonical_vault_authorizer.rs'
          s = p.read_text().replace('principal_ref: context.subject_ref.clone(),','principal_ref: context.principal_ref.clone(),')
          s = s.replace('            principal_ref: context.principal_ref.clone(),\n            capability_id:', '            principal_ref: context.principal_ref.clone(),\n            subject_ref: context.subject_ref.clone(),\n            capability_id:', 1)
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref: "person-1"\.into\(\),)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          for p in root.glob('*.rs'):
              text = p.read_text()
              if 'principal_ref: context.subject_ref.clone()' in text or 'subject_ref: request.principal_ref.clone()' in text:
                  raise SystemExit(f'authorization substitution remains in {p}')
          print('migration complete')
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Validate backend
        working-directory: services/backend-rust
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
      - name: Remove migration workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-authorization-cleanup.yml
          git add services/backend-rust/src
          git diff --check
          git commit -m 'security: preserve canonical actor and subject boundary'
          git push origin HEAD:feat/canonical-principal-subject-scope-v4-clean