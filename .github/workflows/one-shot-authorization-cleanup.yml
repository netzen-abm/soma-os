name: One-shot Authorization Cleanup

on:
  push:
    branches:
      - feat/canonical-principal-subject-scope-v4-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-principal-subject-scope-v4-clean
          fetch-depth: 0
      - name: Apply source-preserving authorization migration
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('services/backend-rust/src')

          # Canonical request: add explicit authorized subject while retaining actor.
          p = root / 'canonical_authorization.rs'
          s = p.read_text()
          s = s.replace('    pub principal_ref: String,\n    pub capability_id:', '    pub principal_ref: String,\n    pub subject_ref: String,\n    pub capability_id:', 1)
          s = re.sub(r'(principal_ref: "principal-1"\.to_owned\(\),\n)', r'\1            subject_ref: "person-1".to_owned(),\n', s, count=1)
          s = re.sub(r'(principal_ref: "principal-1"\.into\(\),\n)', r'\1            subject_ref: "person-1".into(),\n', s, count=1)
          s = s.replace('        assert_eq!(request.principal_ref, "principal-1");\n', '        assert_eq!(request.principal_ref, "principal-1");\n        assert_eq!(request.subject_ref, "person-1");\n', 1)
          p.write_text(s)

          # Every AuthorizationRequest literal explicitly carries subject_ref.
          for p in root.glob('*.rs'):
              s = p.read_text()
              if 'AuthorizationRequest' in s:
                  s = re.sub(r'(\n\s*principal_ref:\s*([^\n]+),\n)(\s*capability_id:)', lambda m: m.group(1) + re.sub(r'^\s*', '', m.group(1).split(':',1)[1].rstrip(',\n')) and ('\n' + m.group(0).split('\n')[0][:len(m.group(1))-len(m.group(1).lstrip())] + 'subject_ref: ' + m.group(2) + ',') + '\n' + m.group(3), s)
                  p.write_text(s)

          # Fix the subject binding at all authorized health boundaries.
          for name in ('health_state_evidence_link.rs', 'health_state_intervention.rs', 'health_state_measurement.rs', 'health_state_outcome.rs', 'health_state_repository.rs', 'longitudinal_context.rs', 'longitudinal_observation_repository.rs'):
              p = root / name
              s = p.read_text()
              s = s.replace('subject_ref: request.principal_ref.clone()', 'subject_ref: request.subject_ref.clone()')
              # Preserve actor identity in the boundary context where a subject exists.
              if 'principal_ref: String,' not in s:
                  s = re.sub(r'(pub struct Authorized\w+ \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: String,\n\2\3', s, count=1)
              if 'principal_ref: request.principal_ref.clone()' not in s and 'Ok(Self {' in s:
                  s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
              if 'pub fn principal_ref(&self)' not in s and 'pub fn subject_ref(&self)' in s:
                  s = s.replace('    pub fn subject_ref(&self)', '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self)', 1)
              p.write_text(s)

          # Protected DB context gets the same actor/subject separation.
          p = root / 'protected_db_context.rs'
          s = p.read_text()
          if 'principal_ref: String,' not in s:
              s = re.sub(r'(pub struct AuthorizedProtectedDbContext \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: String,\n\2\3', s, count=1)
          if 'principal_ref: request.principal_ref.clone()' not in s:
              s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
          if 'pub fn principal_ref(&self)' not in s and 'pub fn subject_ref(&self)' in s:
              s = s.replace('    pub fn subject_ref(&self)', '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self)', 1)
          p.write_text(s)

          # Shared vault authorization context carries both actor and target subject.
          p = root / 'local_health_vault_storage.rs'
          s = p.read_text()
          s = s.replace('pub struct AuthorizationContext {\n    pub subject_ref:', 'pub struct AuthorizationContext {\n    pub principal_ref: String,\n    pub subject_ref:', 1)
          # All existing self-subject test fixtures are explicit and safe to bind to themselves.
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref: "person-1"\.into\(\),)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          # Production repository adapters pass actor + subject to the vault.
          for name in ('health_state_repository.rs', 'local_longitudinal_observation_repository.rs'):
              p = root / name
              s = p.read_text()
              s = s.replace('AuthorizationContext {\n            subject_ref:', 'AuthorizationContext {\n            principal_ref: context.principal_ref().to_owned(),\n            subject_ref:', 1)
              p.write_text(s)

          # PHR test fixtures use the shared context directly.
          p = root / 'personal_health_record_repository.rs'
          s = p.read_text()
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref: "person-1"\.into\(\),)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          # Canonical vault authorization must authorize the actor, never substitute the subject.
          p = root / 'canonical_vault_authorizer.rs'
          s = p.read_text().replace('principal_ref: context.subject_ref.clone()', 'principal_ref: context.principal_ref.clone()')
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref: "person-1"\.into\(\),)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          # main.rs remains source-preserving; no module change is needed for this migration.
          print('authorization migration source rewrite complete')
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format and compile
        run: |
          cargo fmt --all -- --check
          cargo check --manifest-path services/backend-rust/Cargo.toml
      - name: Verify migration invariants
        run: |
          ! grep -R 'principal_ref: context.subject_ref.clone()' services/backend-rust/src
          ! grep -R 'subject_ref: request.principal_ref.clone()' services/backend-rust/src
          if grep -R -n -A1 'principal_ref:' services/backend-rust/src --include='*.rs' | grep -q 'capability_id:'; then true; fi
      - name: Commit and push repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/backend-rust/src
          git commit -m 'security: preserve canonical actor and subject boundary'
          git push origin HEAD:feat/canonical-principal-subject-scope-v4-clean
