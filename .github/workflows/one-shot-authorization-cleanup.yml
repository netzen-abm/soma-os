name: One-shot Authorization Cleanup

on:
  push:
    branches:
      - feat/canonical-principal-subject-scope-v4-clean

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-principal-subject-scope-v4-clean
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply minimal authorization migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('services/backend-rust/src')
          rust_files = list(root.glob('*.rs'))

          # 1. Canonical request: actor and health/data subject are distinct fields.
          p = root / 'canonical_authorization.rs'
          s = p.read_text()
          if 'pub subject_ref: String,' not in s:
              s = s.replace('    pub principal_ref: String,\n', '    pub principal_ref: String,\n    pub subject_ref: String,\n', 1)
          # Preserve existing self-subject semantics in existing tests/fixtures.
          s = re.sub(r'(principal_ref: "[^"]+"\.into\(\),\n)(\s*capability_id:)', r'\1            subject_ref: "person-1".into(),\n\2', s)
          s = s.replace('assert_eq!(request.principal_ref, "principal-1");', 'assert_eq!(request.principal_ref, "principal-1");\n        assert_eq!(request.subject_ref, "person-1");')
          p.write_text(s)

          # 2. Every request literal must explicitly declare a subject.
          for p in rust_files:
              s = p.read_text()
              def add_subject(m):
                  principal = m.group(1)
                  rest = m.group(2)
                  if 'subject_ref:' in rest.split('capability_id:', 1)[0]:
                      return m.group(0)
                  return principal + '            subject_ref: ' + principal.split(':',1)[1] + rest
              s = re.sub(r'(\s*principal_ref:\s*[^\n]+,\n)(\s*capability_id:)', lambda m: m.group(1) + re.sub(r'^\s*', '            ', 'subject_ref: ' + m.group(1).split(':',1)[1].strip()) + '\n' + m.group(2), s)
              # Normalize accidental duplicated indentation introduced above.
              s = re.sub(r'^(\s*)            subject_ref:', r'\1            subject_ref:', s, flags=re.M)
              p.write_text(s)

          # 3. Context constructors must bind subject to request.subject_ref, never principal_ref.
          for p in rust_files:
              s = p.read_text().replace('subject_ref: request.principal_ref.clone()', 'subject_ref: request.subject_ref.clone()')
              p.write_text(s)

          # 4. Preserve actor identity in the shared vault authorization context.
          p = root / 'local_health_vault_storage.rs'
          s = p.read_text()
          if 'pub principal_ref: String,' not in s:
              s = s.replace('pub struct AuthorizationContext {\n', 'pub struct AuthorizationContext {\n    pub principal_ref: String,\n', 1)
          p.write_text(s)

          # 5. Production vault contexts carry the authorized principal; test fixtures remain self-subject.
          for name in ('health_state_repository.rs', 'local_longitudinal_observation_repository.rs'):
              p = root / name
              s = p.read_text()
              s = s.replace('AuthorizationContext {\n            subject_ref:', 'AuthorizationContext {\n            principal_ref: context.principal_ref().to_owned(),\n            subject_ref:')
              p.write_text(s)

          # 6. Canonical vault authorization evaluates the actor from the context, not the subject.
          p = root / 'canonical_vault_authorizer.rs'
          s = p.read_text().replace('principal_ref: context.subject_ref.clone()', 'principal_ref: context.principal_ref.clone()')
          p.write_text(s)

          # 7. Add actor accessors to authorized contexts that now need to preserve it.
          for name in ('health_state_repository.rs', 'health_state_measurement.rs', 'health_state_intervention.rs', 'health_state_evidence_link.rs', 'longitudinal_context.rs'):
              p = root / name
              s = p.read_text()
              if 'principal_ref: String,' not in s:
                  s = re.sub(r'(pub struct Authorized\w+ \{\n)(\s*)subject_ref:', r'\1\2principal_ref: String,\n\2subject_ref:', s, count=1)
              if 'principal_ref: request.principal_ref.clone()' not in s:
                  s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
              if 'pub fn principal_ref(&self)' not in s:
                  marker = '    pub fn subject_ref(&self) -> &str {'
                  s = s.replace(marker, '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n' + marker, 1)
              p.write_text(s)

          # 8. Protected DB context also preserves actor/subject distinction.
          p = root / 'protected_db_context.rs'
          s = p.read_text()
          if 'principal_ref: String,' not in s:
              s = re.sub(r'(pub struct AuthorizedProtectedDbContext \{\n)(\s*)subject_ref:', r'\1\2principal_ref: String,\n\2subject_ref:', s, count=1)
          if 'principal_ref: request.principal_ref.clone()' not in s:
              s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
          if 'pub fn principal_ref(&self)' not in s:
              s = s.replace('    pub fn subject_ref(&self) -> &str {', '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self) -> &str {', 1)
          p.write_text(s)
          PY
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo check --manifest-path services/backend-rust/Cargo.toml
      - name: Commit repaired branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/backend-rust/src
          git commit -m 'security: preserve canonical actor and subject boundary [skip ci]'
          git push origin HEAD:feat/canonical-principal-subject-scope-v4-clean
