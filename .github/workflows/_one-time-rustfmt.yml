name: One-Time Rust Format Recovery

on:
  push:
    branches:
      - security/local-health-vault-storage-index-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Rust formatting already clean."
            exit 0
          fi
          git add services/backend-rust/src
          git commit -m "style: apply rustfmt to vault storage implementation"
          git push
