name: Temporary Rustfmt Repair

on:
  push:
    branches:
      - feat/canonical-principal-subject-scope-v3

permissions:
  contents: write

jobs:
  rustfmt-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-principal-subject-scope-v3
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.rs'
          git commit -m "style: restore canonical rust formatting [skip ci]"
          git push origin HEAD:feat/canonical-principal-subject-scope-v3
