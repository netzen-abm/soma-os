name: Temporary PR120 Precision Fix

on:
  push:
    branches:
      - feat/canonical-principal-subject-scope-v5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-principal-subject-scope-v5
          fetch-depth: 1
      - name: Apply exact principal-subject migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          replace('services/backend-rust/src/health_state_repository.rs',
              'pub struct AuthorizedHealthStateAccessContext {\n    subject_ref: String,',
              'pub struct AuthorizedHealthStateAccessContext {\n    principal_ref: String,\n    subject_ref: String,')
          replace('services/backend-rust/src/health_state_repository.rs',
              '            &request.principal_ref,\n            &request.capability_id,',
              '            &request.principal_ref,\n            &request.subject_ref,\n            &request.capability_id,')
          replace('services/backend-rust/src/health_state_repository.rs',
              '            subject_ref: request.principal_ref.clone(),\n            scope:',
              '            principal_ref: request.principal_ref.clone(),\n            subject_ref: request.subject_ref.clone(),\n            scope:')
          replace('services/backend-rust/src/health_state_repository.rs',
              '    pub fn subject_ref(&self) -> &str {',
              '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self) -> &str {')
          replace('services/backend-rust/src/health_state_repository.rs',
              '        AuthorizationContext {\n            subject_ref: context.subject_ref().to_owned(),\n            scope:',
              '        AuthorizationContext {\n            principal_ref: context.principal_ref().to_owned(),\n            subject_ref: context.subject_ref().to_owned(),\n            scope:')
          replace('services/backend-rust/src/health_state_repository.rs',
              '            principal_ref: "person-1".into(),\n            capability_id: "health.state.write".into(),',
              '            principal_ref: "principal-1".into(),\n            subject_ref: "person-1".into(),\n            capability_id: "health.state.write".into(),')

          replace('services/backend-rust/src/longitudinal_observation_repository.rs',
              'pub struct AuthorizedObservationAccessContext {\n    subject_ref: String,',
              'pub struct AuthorizedObservationAccessContext {\n    principal_ref: String,\n    subject_ref: String,')
          replace('services/backend-rust/src/longitudinal_observation_repository.rs',
              '            &request.principal_ref,\n            &request.capability_id,',
              '            &request.principal_ref,\n            &request.subject_ref,\n            &request.capability_id,')
          replace('services/backend-rust/src/longitudinal_observation_repository.rs',
              '            subject_ref: request.principal_ref.clone(),\n            scope:',
              '            principal_ref: request.principal_ref.clone(),\n            subject_ref: request.subject_ref.clone(),\n            scope:')
          replace('services/backend-rust/src/longitudinal_observation_repository.rs',
              '    pub fn subject_ref(&self) -> &str {',
              '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self) -> &str {')
          replace('services/backend-rust/src/longitudinal_observation_repository.rs',
              '            principal_ref: "person-1".into(),\n            capability_id: "health.read".into(),',
              '            principal_ref: "principal-1".into(),\n            subject_ref: "person-1".into(),\n            capability_id: "health.read".into(),')

          replace('services/backend-rust/src/local_longitudinal_observation_repository.rs',
              '        AuthorizationContext {\n            subject_ref: context.subject_ref().to_owned(),\n            scope:',
              '        AuthorizationContext {\n            principal_ref: context.principal_ref().to_owned(),\n            subject_ref: context.subject_ref().to_owned(),\n            scope:')
          replace('services/backend-rust/src/local_longitudinal_observation_repository.rs',
              '            principal_ref: "person-1".into(),\n            capability_id: "health.read".into(),',
              '            principal_ref: "principal-1".into(),\n            subject_ref: "person-1".into(),\n            capability_id: "health.read".into(),')

          replace('services/backend-rust/src/protected_db_context.rs',
              'pub struct AuthorizedProtectedDbContext {\n    principal_ref: String,',
              'pub struct AuthorizedProtectedDbContext {\n    principal_ref: String,\n    subject_ref: String,')
          replace('services/backend-rust/src/protected_db_context.rs',
              '            request.principal_ref.as_str(),\n            request.capability_id.as_str(),',
              '            request.principal_ref.as_str(),\n            request.subject_ref.as_str(),\n            request.capability_id.as_str(),')
          replace('services/backend-rust/src/protected_db_context.rs',
              '            principal_ref: request.principal_ref.clone(),\n            capability_id:',
              '            principal_ref: request.principal_ref.clone(),\n            subject_ref: request.subject_ref.clone(),\n            capability_id:')
          replace('services/backend-rust/src/protected_db_context.rs',
              '    pub fn capability_id(&self) -> &str {',
              '    pub fn subject_ref(&self) -> &str {\n        &self.subject_ref\n    }\n\n    pub fn capability_id(&self) -> &str {')
          replace('services/backend-rust/src/protected_db_context.rs',
              '            principal_ref: "principal-1".into(),\n            capability_id: "health.read".into(),',
              '            principal_ref: "principal-1".into(),\n            subject_ref: "person-1".into(),\n            capability_id: "health.read".into()', expected=2)

          replace('services/backend-rust/src/longitudinal_context.rs',
              'use thiserror::Error;\n\n',
              '')

          print('Exact principal/subject migrations applied.')
          PY
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend-rust/src
          git commit -m "security: complete PR120 principal-subject propagation"
          git push origin HEAD:feat/canonical-principal-subject-scope-v5
