name: Archive and retire merged PR branches

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  archive-and-retire:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Test branch-retirement safety policy
        run: python scripts/test_retire_merged_branch.py

      - name: Archive exact merged head, then retire source branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/retire_merged_branch.py
