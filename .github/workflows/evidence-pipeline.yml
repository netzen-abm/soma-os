name: SOMA Evidence Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
      - feature/**
  pull_request:
    branches:
      - main
      - development

jobs:
  evidence-pipeline:
    name: Evidence pipeline tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile evidence scripts
        run: python -m compileall -q scripts

      - name: Run evidence pipeline tests
        run: python -m pytest scripts -q

      - name: Validate canonical evidence mapping pilot
        run: >-
          python scripts/validate_evidence_canonical_mapping_pilot.py
          scripts/fixtures/evidence_canonical_mapping_pilot.json

      - name: Validate architecture and governance invariants
        run: >-
          python scripts/validate_architecture_governance_gate.py

      - name: Run controlled migration pilot
        run: >-
          python scripts/pilot_medical_migration.py
          scripts/fixtures/medical_migration_pilot.json
