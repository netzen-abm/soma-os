name: SOMA Local Health Vault Key Lifecycle Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - development

env:
  SOMA_CI_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Local vault key lifecycle contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOMA_CI_CHECKOUT_REF }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate key lifecycle schema JSON
        run: python -m json.tool schemas/local-health-vault-key-lifecycle-v1.json > /dev/null

      - name: Run key lifecycle contract tests
        working-directory: services/shared
        run: python -m unittest -v local_health_vault_key_lifecycle_contract_test.py
