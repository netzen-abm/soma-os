name: Temporary PR120 Rustfmt Reconciliation

on:
  push:
    branches:
      - fix/pr120-precision-reconciliation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr120-precision-reconciliation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        working-directory: services/backend-rust
        run: cargo fmt --all
      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend-rust/src
          git commit -m "style: apply rustfmt to PR120 sources"
          git push origin HEAD:fix/pr120-precision-reconciliation
