name: Temporary authorization migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-principal-subject-scope-v4-clean
          fetch-depth: 0

      - name: Apply minimal authorization migration
        working-directory: services/backend-rust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('src')
          # Add the explicit subject field to every AuthorizationRequest literal that
          # still represents the pre-migration self-subject request shape.
          for p in root.glob('*.rs'):
              if p.name == 'canonical_authorization.rs':
                  continue
              s = p.read_text()
              if 'AuthorizationRequest {' not in s:
                  continue
              if 'subject_ref:' not in s[s.find('AuthorizationRequest {'):]:
                  s = re.sub(r'(AuthorizationRequest \{\n)(\s*)principal_ref: ([^\n]+),\n(\s*)capability_id:',
                             lambda m: m.group(1)+m.group(2)+'principal_ref: '+m.group(3)+',\n'+m.group(4)+'subject_ref: '+m.group(3)+',\n'+m.group(4)+'capability_id:', s)
              else:
                  # Handle multiple literals independently.
                  def fix(m):
                      body = m.group(0)
                      if 'subject_ref:' in body:
                          return body
                      body = re.sub(r'(principal_ref: ([^\n]+),\n)(\s*capability_id:)',
                                    lambda x: x.group(1)+re.match(r'\s*', x.group(3)).group(0)+'subject_ref: '+x.group(2)+',\n'+x.group(3), body, count=1)
                      return body
                  s = re.sub(r'AuthorizationRequest \{.*?\n\s*\}', fix, s, flags=re.S)
              p.write_text(s)

          # Propagate actor identity into protected contexts while binding protected
          # data to the separately authorized subject identity.
          names = ['health_state_evidence_link.rs','health_state_intervention.rs','health_state_measurement.rs',
                   'health_state_outcome.rs','health_state_repository.rs','longitudinal_context.rs',
                   'longitudinal_observation_repository.rs','protected_db_context.rs']
          for name in names:
              p = root / name
              s = p.read_text()
              if 'pub struct Authorized' not in s:
                  continue
              s = re.sub(r'(pub struct Authorized\w+ \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: String,\n\2\3', s, count=1)
              s = s.replace('Ok(Self {\n            subject_ref:', 'Ok(Self {\n            principal_ref: request.principal_ref.clone(),\n            subject_ref:', 1)
              s = s.replace('subject_ref: request.principal_ref.clone()', 'subject_ref: request.subject_ref.clone()')
              if 'pub fn principal_ref(&self)' not in s and 'pub fn subject_ref(&self)' in s:
                  s = s.replace('    pub fn subject_ref(&self)', '    pub fn principal_ref(&self) -> &str {\n        &self.principal_ref\n    }\n\n    pub fn subject_ref(&self)', 1)
              p.write_text(s)

          p = root / 'local_health_vault_storage.rs'
          s = p.read_text()
          s = s.replace('pub struct AuthorizationContext {\n    pub subject_ref:', 'pub struct AuthorizationContext {\n    pub principal_ref: String,\n    pub subject_ref:', 1)
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          for name in ('health_state_repository.rs','longitudinal_observation_repository.rs'):
              p = root / name
              s = p.read_text().replace('AuthorizationContext {\n            subject_ref:', 'AuthorizationContext {\n            principal_ref: context.principal_ref().to_owned(),\n            subject_ref:', 1)
              p.write_text(s)

          p = root / 'personal_health_record_repository.rs'
          s = p.read_text()
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          p = root / 'canonical_vault_authorizer.rs'
          s = p.read_text().replace('principal_ref: context.subject_ref.clone(),', 'principal_ref: context.principal_ref.clone()')
          s = s.replace('principal_ref: context.principal_ref.clone(),\n            capability_id:', 'principal_ref: context.principal_ref.clone(),\n            subject_ref: context.subject_ref.clone(),\n            capability_id:', 1)
          s = re.sub(r'(AuthorizationContext \{\n)(\s*)(subject_ref:)', r'\1\2principal_ref: "person-1".into(),\n\2\3', s)
          p.write_text(s)

          # Structural fail-closed guards.
          for p in root.glob('*.rs'):
              t = p.read_text()
              if 'principal_ref: context.subject_ref.clone()' in t or 'subject_ref: request.principal_ref.clone()' in t:
                  raise SystemExit(f'unsafe actor/subject substitution remains in {p}')
          print('migration complete')
          PY

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Validate backend
        working-directory: services/backend-rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets

      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-authz-migration.yml
          git add services/backend-rust/src
          git commit -m "security: converge authorization actor subject context"
          git push origin feat/canonical-principal-subject-scope-v4-clean
