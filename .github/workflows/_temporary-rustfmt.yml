name: Temporary Rust Format Normalization

on:
  push:
    branches:
      - security/current

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/current
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run canonical rustfmt
        working-directory: services/backend-rust
        run: cargo fmt --all
      - name: Commit formatting normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add services/backend-rust
          git commit -m "style: normalize Rust formatting"
          git push origin HEAD:security/current
