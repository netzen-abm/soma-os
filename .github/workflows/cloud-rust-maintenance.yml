name: SOMA Cloud Rust Maintenance

on:
  push:
    branches: [ "stabilization/baseline-audit" ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to maintain"
        required: true
        default: "stabilization/baseline-audit"
        type: string

permissions:
  contents: write

concurrency:
  group: soma-cloud-rust-maintenance-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  rust-maintenance:
    name: Format, compile, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Initialize stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "services/backend-rust -> target"

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all

      - name: Commit formatting-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend-rust
          git commit -m "style: normalize Rust formatting"
          git push origin "HEAD:${{ inputs.branch || github.ref_name }}"

      - name: Verify formatting
        run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all -- --check

      - name: Compile backend
        run: cargo check --manifest-path services/backend-rust/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --manifest-path services/backend-rust/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path services/backend-rust/Cargo.toml --all-targets --verbose
