name: Temporary Rustfmt Artifact

on:
  push:
    branches:
      - security/implement-personal-health-record-repository-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Rust sources
        run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all
      - name: Upload formatted PHR repository source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-phr-repository
          path: services/backend-rust/src/personal_health_record_repository.rs
