name: Temporary Rustfmt Artifact

on:
  pull_request:
    paths:
      - "services/backend-rust/src/personal_health_record_repository.rs"
      - "services/backend-rust/src/main.rs"
      - ".github/workflows/_temporary_rustfmt_artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Rust sources
        run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all
      - name: Upload formatted PHR repository source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-phr-repository
          path: services/backend-rust/src/personal_health_record_repository.rs