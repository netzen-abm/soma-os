name: SOMA One-Time Stabilization Formatter

on:
  push:
    branches:
      - stabilization/baseline-audit

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilization/baseline-audit
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all

      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            echo "Rust source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend-rust rustfmt.toml
          git commit -m "style: canonicalize stabilization Rust formatting"
          git push origin HEAD:stabilization/baseline-audit
