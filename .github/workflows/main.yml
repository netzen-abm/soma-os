name: SOMA Continuous Integration

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  code-audit:
    name: Rust format, compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatin/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Check Rust formatting
        run: >-
          cargo fmt
          --manifest-path services/backend-rust/Cargo.toml
          --all
          -- --check

      - name: Check Rust compilation
        run: >-
          cargo check
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          -- -D warnings -A dead_code

  shared-infrastructure:
    name: Shared infrastructure governance and policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate capability registry JSON
        run: python -m json.tool services/shared/capability_registry.json > /dev/null

      - name: Validate architecture and evidence governance invariants
        run: python scripts/validate_architecture_governance_gate.py

      - name: Run Policy Kernel tests
        working-directory: services/shared
        run: python -m unittest -v policy_kernel_test.py

  cryptographic-testing:
    name: Cryptographic and integrity tests
    needs: code-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatin/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Run Rust tests
        run: >-
          cargo test
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          --verbose
