name: SomaOS Continuous Integration Engine

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  code-audit:
    name: Structural Architecture Check & Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Blueprints
      uses: actions/checkout@v4

    - name: Initialize Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Build Artifacts Dependencies
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "services/backend-rust -> target"

    - name: Enforce Code Format Guidelines
      run: cargo fmt --manifest-path services/backend-rust/Cargo.toml --all -- --check

    - name: Run Static Code Analysis (Clippy)
      run: cargo clippy --manifest-path services/backend-rust/Cargo.toml -- -D warnings

  cryptographic-testing:
    name: Zero-Knowledge Verification Testing Matrix
    needs: code-audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Blueprints
      uses: actions/checkout@v4

    - name: Initialize Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Build Artifacts Dependencies
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "services/backend-rust -> target"

    - name: Execute Cryptographic & Synchronization Testing Matrices
      run: cargo test --manifest-path services/backend-rust/Cargo.toml --verbose
