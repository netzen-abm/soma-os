name: SOMA Continuous Integration

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  SOMA_CI_CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  code-audit:
    name: Rust format, compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOMA_CI_CHECKOUT_REF }}
          fetch-depth: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Check Rust formatting
        run: >-
          cargo fmt
          --manifest-path services/backend-rust/Cargo.toml
          --all
          -- --check

      - name: Check Rust compilation
        run: >-
          cargo check
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          -- -D warnings -A dead_code

  shared-infrastructure:
    name: Shared infrastructure governance and health contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOMA_CI_CHECKOUT_REF }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate capability registry JSON
        run: python -m json.tool services/shared/capability_registry.json > /dev/null

      - name: Validate architecture and evidence governance invariants
        run: python scripts/validate_architecture_governance_gate.py

      - name: Validate Health State and Evidence contracts
        run: python scripts/validate_health_contracts.py

      - name: Validate Personal Health Record JSON contracts
        run: >-
          python -m json.tool schemas/personal-health-profile-v1.json > /dev/null
          && python -m json.tool schemas/emergency-health-profile-v1.json > /dev/null
          && python -m json.tool schemas/health-sharing-grant-v1.json > /dev/null

      - name: Validate Health Context Framework JSON contract
        run: python -m json.tool schemas/health-context-framework-v1.json > /dev/null

      - name: Validate Local Health Vault JSON contract
        run: python -m json.tool schemas/local-health-vault-record-v1.json > /dev/null

      - name: Validate IdentityContext JSON contract
        run: python -m json.tool schemas/identity-context-v1.json > /dev/null

      - name: Validate Authorization Enforcement Context JSON contract
        run: python -m json.tool schemas/authorization-enforcement-context-v1.json > /dev/null

      - name: Run Health State and Evidence contract tests
        working-directory: services/shared
        run: python -m unittest -v health_contract_test.py

      - name: Run Cross-Paradigm Evidence benchmark tests
        working-directory: services/shared
        run: python -m unittest -v cross_paradigm_evidence_test.py

      - name: Run Personal Health Record contract tests
        working-directory: services/shared
        run: python -m unittest -v personal_health_record_contract_test.py

      - name: Run Health Context Framework contract tests
        working-directory: services/shared
        run: python -m unittest -v health_context_framework_contract_test.py

      - name: Run Policy Kernel tests
        working-directory: services/shared
        run: python -m unittest -v policy_kernel_test.py

      - name: Run IdentityContext contract tests
        working-directory: services/shared
        run: python identity_context_test.py

      - name: Run Identity Authorization Enforcement tests
        working-directory: services/shared
        run: python identity_authorization_enforcement_test.py

  protected-data-bypass-audit:
    name: Protected-data access bypass audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOMA_CI_CHECKOUT_REF }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit protected-data access paths
        run: python scripts/audit_protected_data_access.py

  postgres-security-integration:
    name: PostgreSQL protected-data isolation tests
    needs: code-audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: somaos_test
          POSTGRES_USER: somaos_test
          POSTGRES_PASSWORD: somaos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U somaos_test -d somaos_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SOMA_TEST_DATABASE_URL: postgresql://somaos_test:somaos_test_password@localhost:5432/somaos_test
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOMA_CI_CHECKOUT_REF }}
          fetch-depth: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Run PostgreSQL protected-data integration tests
        run: >-
          cargo test
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          --verbose

      - name: Verify final protected-data NOT NULL gate
        run: bash scripts/verify_final_protected_data_gate.sh

  cryptographic-testing:
    name: Cryptographic and integrity tests
    needs: code-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOMA_CI_CHECKOUT_REF }}
          fetch-depth: 1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Run Rust tests
        run: >-
          cargo test
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          --verbose
