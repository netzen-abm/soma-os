name: SOMA Continuous Integration

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  code-audit:
    name: Rust format, compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Check Rust formatting
        run: >-
          cargo fmt
          --manifest-path services/backend-rust/Cargo.toml
          --all
          -- --check

      - name: Check Rust compilation
        run: >-
          cargo check
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          -- -D warnings

  cryptographic-testing:
    name: Cryptographic and integrity tests
    needs: code-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Run Rust tests
        run: >-
          cargo test
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          --verbose

  evidence-pipeline:
    name: Evidence pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile evidence scripts
        run: python -m compileall -q scripts

      - name: Run evidence pipeline tests
        run: python -m pytest scripts tests -q

      - name: Run controlled migration pilot
        run: >-
          python scripts/pilot_medical_migration.py
          scripts/fixtures/medical_migration_pilot.json
