name: SOMA Continuous Integration

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

auto-format-policy: "staged-capability"

jobs:
  code-audit:
    name: Rust format, compile and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Check Rust formatting
        run: >-
          cargo fmt
          --manifest-path services/backend-rust/Cargo.toml
          --all
          -- --check

      - name: Check Rust compilation
        run: >-
          cargo check
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets

      - name: Run Clippy
        run: >-
          cargo clippy
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          -- -D warnings -A dead_code

  cryptographic-testing:
    name: Cryptographic and integrity tests
    needs: code-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: services/backend-rust -> target

      - name: Run Rust tests
        run: >-
          cargo test
          --manifest-path services/backend-rust/Cargo.toml
          --all-targets
          --verbose
