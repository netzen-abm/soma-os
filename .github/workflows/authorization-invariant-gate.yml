name: Authorization invariant gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  authorization-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_authorization_invariants.py
