name: Sync to GitLab

# GitLab is a release/final-repository mirror, not a development mirror.
# Only a pull request that is actually merged into canonical GitHub main can
# trigger this workflow. Feature branches, draft work, open PRs, and direct
# pushes to main are never mirrored by this workflow.
on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

env:
  GITLAB_MIRROR_BRANCH: main

concurrency:
  group: gitlab-main-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Push and verify final GitLab mirror
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate promotion provenance
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          test "$BASE_REF" = "main" || {
            echo "GitLab mirror promotion denied: PR base is not main."
            exit 1
          }

          test "$PR_MERGED" = "true" || {
            echo "GitLab mirror promotion denied: PR was not merged."
            exit 1
          }

          test -n "$MERGE_COMMIT_SHA" || {
            echo "GitLab mirror promotion denied: merged commit SHA is missing."
            exit 1
          }

          echo "Approved promotion source: merged PR #${{ github.event.pull_request.number }}"
          echo "Canonical main commit: $MERGE_COMMIT_SHA"

      - name: Validate GitLab repository configuration
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_REPOSITORY" || {
            echo "GITLAB_REPOSITORY secret is not configured (expected owner/repository.git or owner/repository)."
            exit 1
          }
          test -n "$GITLAB_DEPLOY_KEY" || {
            echo "GITLAB_DEPLOY_KEY secret is not configured."
            exit 1
          }

      - name: Configure GitLab SSH authentication
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519_gitlab_mirror"
          chmod 600 "$HOME/.ssh/id_ed25519_gitlab_mirror"
          ssh-keyscan -H gitlab.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host gitlab.com
            HostName gitlab.com
            User git
            IdentityFile ~/.ssh/id_ed25519_gitlab_mirror
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Push final main and tags to GitLab
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          repo="${GITLAB_REPOSITORY%.git}"
          git remote add gitlab "git@gitlab.com:${repo}.git"

          # GitHub main is canonical. Promote only the exact commit produced by
          # the merged PR; never push feature/open/draft branch refs.
          git push gitlab "${MERGE_COMMIT_SHA}:refs/heads/${GITLAB_MIRROR_BRANCH}" --force

          # Mirror tag creation, movement, and deletion from the canonical
          # repository state. No branch refs other than main are sent.
          git push gitlab --prune --force 'refs/tags/*:refs/tags/*'

      - name: Verify GitLab main matches promoted canonical commit
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          repo="${GITLAB_REPOSITORY%.git}"
          gitlab_main_sha="$(git ls-remote "git@gitlab.com:${repo}.git" "refs/heads/${GITLAB_MIRROR_BRANCH}" | awk 'NR == 1 { print $1 }')"

          test -n "$gitlab_main_sha" || {
            echo "GitLab mirror verification failed: main ref was not returned."
            exit 1
          }

          if [ "$gitlab_main_sha" != "$MERGE_COMMIT_SHA" ]; then
            echo "GitLab mirror verification failed: SHA mismatch."
            echo "Promoted canonical: $MERGE_COMMIT_SHA"
            echo "GitLab main:       $gitlab_main_sha"
            exit 1
          fi

          echo "GitLab main verified at $gitlab_main_sha"
