name: Sync to GitLab

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    name: Push main and tags to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitLab repository configuration
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
        run: |
          test -n "$GITLAB_REPOSITORY" || {
            echo "GITLAB_REPOSITORY secret is not configured (expected owner/repository.git or owner/repository)."
            exit 1
          }

      - name: Push to GitLab mirror
        env:
          GITLAB_TOKEN_USER: ${{ secrets.GITLAB_TOKEN_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
        run: |
          set -euo pipefail

          test -n "$GITLAB_TOKEN_USER" || { echo "GITLAB_TOKEN_USER secret is not configured."; exit 1; }
          test -n "$GITLAB_TOKEN" || { echo "GITLAB_TOKEN secret is not configured."; exit 1; }

          repo="${GITLAB_REPOSITORY%.git}"
          git remote add gitlab "https://${GITLAB_TOKEN_USER}:${GITLAB_TOKEN}@gitlab.com/${repo}.git"

          # Mirror all branches and tags so GitLab follows GitHub mainline history.
          # This is intentionally force-updating: GitHub main is the canonical source.
          git push gitlab --all --force
          git push gitlab --tags --force
