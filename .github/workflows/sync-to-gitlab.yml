name: Sync to GitLab

# GitLab is a release/final-repository mirror, not a development mirror.
# The workflow runs on changes to canonical GitHub main, but promotion is
# fail-closed unless the exact commit was introduced by a merged PR to main.
# Feature branches, draft/open PRs, and direct commits to main are never sent.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  GITLAB_MIRROR_BRANCH: main

concurrency:
  group: gitlab-main-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Push and verify final GitLab mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact canonical main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate merged-PR promotion provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)]')"

          count="$(printf '%s' "$prs" | jq 'length')"
          test "$count" -ge 1 || {
            echo "GitLab mirror promotion denied: canonical commit is not associated with a merged PR into main."
            echo "GitHub main commit: $GITHUB_SHA"
            exit 1
          }

          echo "Approved GitLab promotion source: merged PR into main."
          printf '%s\n' "$prs" | jq -r '.[] | "PR #\(.number): \(.title) — merged \(.merged_at)"'
          echo "Canonical main commit: $GITHUB_SHA"

      - name: Validate GitLab repository configuration
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_REPOSITORY" || {
            echo "GITLAB_REPOSITORY secret is not configured (expected owner/repository.git or owner/repository)."
            exit 1
          }
          test -n "$GITLAB_DEPLOY_KEY" || {
            echo "GITLAB_DEPLOY_KEY secret is not configured."
            exit 1
          }

      - name: Configure GitLab SSH authentication
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519_gitlab_mirror"
          chmod 600 "$HOME/.ssh/id_ed25519_gitlab_mirror"
          ssh-keyscan -H gitlab.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host gitlab.com
            HostName gitlab.com
            User git
            IdentityFile ~/.ssh/id_ed25519_gitlab_mirror
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Push final main and tags to GitLab
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          repo="${GITLAB_REPOSITORY%.git}"
          git remote add gitlab "git@gitlab.com:${repo}.git"

          # GitHub main is canonical. Promote only the exact, merged-PR commit.
          # Never push feature/open/draft branch refs.
          git push gitlab "${GITHUB_SHA}:refs/heads/${GITLAB_MIRROR_BRANCH}" --force

          # Mirror tag creation, movement, and deletion from the canonical repo.
          git push gitlab --prune --force 'refs/tags/*:refs/tags/*'

      - name: Verify GitLab main matches promoted canonical commit
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          repo="${GITLAB_REPOSITORY%.git}"
          gitlab_main_sha="$(git ls-remote "git@gitlab.com:${repo}.git" "refs/heads/${GITLAB_MIRROR_BRANCH}" | awk 'NR == 1 { print $1 }')"

          test -n "$gitlab_main_sha" || {
            echo "GitLab mirror verification failed: main ref was not returned."
            exit 1
          }

          if [ "$gitlab_main_sha" != "$GITHUB_SHA" ]; then
            echo "GitLab mirror verification failed: SHA mismatch."
            echo "GitHub canonical: $GITHUB_SHA"
            echo "GitLab main:     $gitlab_main_sha"
            exit 1
          fi

          echo "GitLab main verified at $gitlab_main_sha"
