name: Sync to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Push main and tags to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitLab repository configuration
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_REPOSITORY" || {
            echo "GITLAB_REPOSITORY secret is not configured (expected owner/repository.git or owner/repository)."
            exit 1
          }
          test -n "$GITLAB_DEPLOY_KEY" || {
            echo "GITLAB_DEPLOY_KEY secret is not configured."
            exit 1
          }

      - name: Configure GitLab SSH authentication
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519_gitlab_mirror"
          chmod 600 "$HOME/.ssh/id_ed25519_gitlab_mirror"
          ssh-keyscan -H gitlab.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host gitlab.com
            HostName gitlab.com
            User git
            IdentityFile ~/.ssh/id_ed25519_gitlab_mirror
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Push to GitLab mirror
        env:
          GITLAB_REPOSITORY: ${{ secrets.GITLAB_REPOSITORY }}
        run: |
          set -euo pipefail

          repo="${GITLAB_REPOSITORY%.git}"
          git remote add gitlab "git@gitlab.com:${repo}.git"

          # GitHub main is the canonical source. Force-updating the destination
          # keeps the GitLab mirror aligned with the canonical GitHub history.
          git push gitlab --all --force
          git push gitlab --tags --force
