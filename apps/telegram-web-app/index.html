<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SomaOS Sovereign Vault</title>
    <!-- Telegram WebApp Integration Script -->
    <script src="https://telegram.org"></script>
    <style>
        body { background-color: #0B132B; color: #FFFFFF; margin: 0; padding: 0; }
        .tg-btn { width: 90%; margin: 20px auto; display: block; padding: 15px; background: #5BC0BE; border: none; border-radius: 8px; color: #0B132B; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main"></div>
    <button class="tg-btn" onclick="sendDataToBot()">Verify Health Status (ZKP)</button>

    <script>
        // Tell Telegram the WebApp is ready
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Forces full-screen view for premium medical-cockpit look

        function sendDataToBot() {
            // Generate a Zero-Knowledge Proof payload that contains no identifying user metadata
            const zkpPayload = { proof_type: "vitality_verified", timestamp: Date.now() };
            window.Telegram.WebApp.sendData(JSON.stringify(zkpPayload));
        }
    </script>
</body>
</html>
