version: '3.8'

services:
  somaos-db:
    image: postgres:15-alpine
    container_name: somaos_postgres_node
    environment:
      # Local bootstrap/admin credential only. Do not reuse it as the application
      # runtime credential. Supply it through the environment or a secret file.
      POSTGRES_USER: ${SOMA_DB_BOOTSTRAP_USER:-somaos_bootstrap}
      POSTGRES_PASSWORD: ${SOMA_DB_BOOTSTRAP_PASSWORD:?SOMA_DB_BOOTSTRAP_PASSWORD must be set}
      POSTGRES_DB: somaos_vitals_persistence
    volumes:
      - postgres_sovereign_data:/var/lib/postgresql/data
    expose:
      - "5432" # Exposes database port ONLY inside the internal bridge network layer
    restart: unless-stopped
    networks:
      - somaos-isolated-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOMA_DB_BOOTSTRAP_USER:-somaos_bootstrap} -d somaos_vitals_persistence"]
      interval: 10s
      timeout: 5s
      retries: 5

  somaos-kernel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: somaos_runtime_server
    ports:
      - "8080:8080" # Maps outer gateway routing ports to handle Telegram/WhatsApp webhooks
    environment:
      # The application must use the separately provisioned application LOGIN
      # credential. Never point DATABASE_URL at the bootstrap/admin credential.
      - DATABASE_URL=${SOMA_APP_DATABASE_URL:?SOMA_APP_DATABASE_URL must be set}
      - RUST_LOG=info
      - META_WHATSAPP_TOKEN=${META_WHATSAPP_TOKEN:?META_WHATSAPP_TOKEN must be set}
      - META_PHONE_ID=${META_PHONE_ID:?META_PHONE_ID must be set}
    restart: unless-stopped
    depends_on:
      somaos-db:
        condition: service_healthy
    networks:
      - somaos-isolated-mesh

  showcase-brochure:
    image: nginx:alpine
    container_name: somaos_nginx_brochure
    ports:
      - "80:80" # Public facing digital brochure routing entry portal
    volumes:
      - ./public:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - somaos-isolated-mesh

volumes:
  postgres_sovereign_data:
    driver: local

networks:
  somaos-isolated-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16 # Custom sub-network containment mapping layout
