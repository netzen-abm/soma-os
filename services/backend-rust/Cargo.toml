[package]
name = "soma_backend"
version = "0.1.0"
edition = "2021"
authors = ["SomaOS Core Architects"]
description = "SOMA backend application core"

[dependencies]
# Async web and routing.
axum = { version = "0.7.5", features = ["macros"] }
tokio = { version = "1.38.0", features = ["full"] }
tower = { version = "0.4.13", features = ["util"] }

# Async PostgreSQL data access.
sqlx = {
    version = "0.7.4",
    features = [
        "runtime-tokio-native-tls",
        "postgres",
        "macros",
        "chrono",
    ],
}
chrono = { version = "0.4.38", features = ["serde"] }

# Cryptography and encoded identifiers.
ring = "0.17.8"
sha2 = "0.10.8"
hex = "0.4.3"
base64 = "0.22.1"
secp256k1 = { version = "0.29.0", features = [
    "global-context",
    "rand-std",
] }

# Compression.
flate2 = "1.0.30"

# Native mobile bindings and error types.
uniffi = { version = "0.28.0", features = ["tokio"] }
thiserror = "1.0.61"

# WebSocket and HTTP clients.
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }
futures-util = "0.3.30"
reqwest = { version = "0.12.5", features = ["json"] }

# Serialization.
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.118"

[build-dependencies]
uniffi = { version = "0.28.0", features = ["build"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
